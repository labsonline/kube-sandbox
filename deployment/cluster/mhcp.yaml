---
apiVersion: v1
kind: Secret
metadata:
  name: maas-cluster-identity-secret
---
apiVersion: k0rdent.mirantis.com/v1beta1
kind: Credential
metadata:
  name: mhcp-cluster-cred
spec:
  identityRef:
    apiVersion: v1
    kind: Secret
    name: maas-cluster-identity-secret
    namespace: kcm-system
---
apiVersion: k0rdent.mirantis.com/v1beta1
kind: ClusterDeployment
metadata:
  name: mhcp
spec:
  template: maas-standalone-cp-0-1-2
  credential: mhcp-cluster-cred
  dryRun: false
  config:
    controlPlaneEndpointIP: ""
    controlPlaneNumber: 1
    workersNumber: 2
    # clusterAnnotations:
    #   domain: ""
    # clusterLabels:
    #   app.kubernetes.io/knative: enabled
    #   app.kubernetes.io/addon: enabled
    controlPlane:
      image: ubuntu
      minCPU: 2
      minMemory: 8192
      resourcePool: ""
      tags: []
    worker:
      image: ubuntu
      minCPU: 2
      minMemory: 8192
      resourcePool: ""
      tags: []
    maas:
      dnsDomain: ""
    # preStartCommands:
    #   # - update-ca-certificates
    # customUserDataRef:
    #   secretRef:
    #     name: mscp-base-userdata
    #     key: value
    k0s:
      version: v1.35.4+k0s.0
      arch: arm64
      network:
        provider: custom
      api:
        extraArgs: {}
      cpArgs: []
      workerArgs: []
  serviceSpec:
    services:
      - name: cilium
        namespace: kube-system
        template: cni-1-0-7
        values: |
          # FIXME: cilium
          cilium:
            enabled: true
            kubeProxyReplacement: true
            k8sServiceHost: ""
            k8sServicePort: 6443
            # ipv6:
            #   enabled: true
            operator:
              replicas: 1
            # hubble:
            #   relay:
            #     enabled: true
            #   ui:
            #     enabled: true
            # nodePort:
            #   addresses: []
            # bpf:
            #   hostLegacyRouting: true
            # bgp:
            #   enabled: true
            #   peer:
            #     authSecretRef: ""
            #     addressFamilies:
            #       - afi: ipv4
            #         safi: unicast
            #         advertisements:
            #           matchLabels:
            #             advertise: bgp
            #       - afi: ipv6
            #         safi: unicast
            #         advertisements:
            #           matchLabels:
            #             advertise: bgp
            #   instances:
            #     - name: frr
            #       localASN: 64512
            #       overrides:
            #         enabled: true
            #       peers:
            #         - name: frrv4
            #           peerASN: 64513
            #           peerAddress: ""
            #           peerConfigRef:
            #             name: bgp-peer-config
            #         - name: frrv6
            #           peerASN: 64513
            #           peerAddress: ""
            #           peerConfigRef:
            #             name: bgp-peer-config
            # pool:
            #   enabled: true
            #   blocks:
            #     - cidr: ""
            #     - cidr: ""
      - name: openebs
        namespace: kube-system
        template: csi-1-0-7
