      minMemory: 8192
      resourcePool: ""
      tags: []
    worker:
      image: ubuntu
      minCPU: 2
      minMemory: 8192
      resourcePool: ""
      tags: []
    maas:
      dnsDomain: ""
    # preStartCommands:
    #   - update-ca-certificates
    customUserDataRef:
      secretRef:
        name: mscp-base-userdata
        key: value
    k0s:
