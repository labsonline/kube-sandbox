# FIXME: update hard-coded values with cluster annotations
---
apiVersion: k0rdent.mirantis.com/v1beta1
kind: MultiClusterService
metadata:
  name: mgmt-external-secret
spec:
  clusterSelector:
    matchLabels:
      k0rdent.mirantis.com/management-cluster: "true"
      sveltos-agent: present
  dependsOn: []
  serviceSpec:
    priority: 100
    provider:
      name: ksm-projectsveltos
      selfManagement: true
    services:
      - template: eso-2-8-0
        name: external-secret-operator
        namespace: operators
        dependsOn: []
        values: |
          eso:
            enabled: true
            replicaCount: 1
            bitwarden-sdk-server:
              enabled: false
              namespaceOverride: ""
      # FIXME: externalsecret
      - template: eso-2-5-0
        name: external-secret
        namespace: sre
        # dependsOn:
        #   - name: external-secret-operator
        #     namespace: operators
        #   - name: vault
        #     namespace: sre
        values: |
          generators:
            - kind: ClusterGenerator
              name: pwdgen
              generator:
                passwordSpec:
                  length: 42
                  digits: 5
                  symbols: 5
                  symbolCharacters: -_$@
                  noUpper: false
                  allowRepeat: true
            # - kind: ClusterGenerator
            #   name: uuidgen
            #   type: UUID
            #   generator:
            #     uuidSpec: {}
            # - kind: ClusterGenerator
            #   name: sshkeygen
            #   type: SSHKey
            #   generator:
            #     sshKeySpec:
            #       keyType: ed25519
          secretStores:
            - kind: ClusterSecretStore
              name: vault
              provider:
                vault:
                  server: https://vault.sandbox.testplay.io
                  namespace: sandbox
                  path: secret
                  version: v2
                  checkAndSet:
                    required: true
                  auth:
                    appRole:
                      path: approle
                      # FIXME: replace with the secret-id of the approle created in vault
                      roleId: ""
                      secretRef:
                        name: external-secrets-vault-credential
                        namespace: sre
                        key: secret-id
          externalSecrets:
            - kind: ClusterExternalSecret
              name: root-ca
              matchLabels:
                rootca: enabled
              externalSecretSpec:
                secretStoreRef:
                  name: vault
                  kind: ClusterSecretStore
                target:
                  name: root-ca
                data:
                  - secretKey: ca.crt
                    remoteRef:
                      key: ca
                      property: ca.crt
            - kind: ClusterExternalSecret
              name: base-userdata
              matchLabels:
                cloudinit: enabled
              externalSecretSpec:
                secretStoreRef:
                  name: vault
                  kind: ClusterSecretStore
                target:
                  name: base-userdata
                  template:
                    engineVersion: v2
                    data:
                      value: |
                        #cloud-config
                        merge_how:
                          - name: list
                            settings: [append]
                          - name: dict
                            settings: [no_replace, recurse_list]
                        {{ .userdata }}
                data:
                  - secretKey: userdata
                    remoteRef:
                      key: cloudinit
                      property: userdata
            - kind: ExternalSecret
              name: tsig-secret
              namespace: kcm-system
              externalSecretSpec:
                secretStoreRef:
                  name: vault
                  kind: ClusterSecretStore
                target:
                  name: tsig-secret
                data:
                  - secretKey: secret
                    remoteRef:
                      key: maas/tsig
                      property: certmanager
            - kind: ExternalSecret
              name: tsig-secret
              namespace: kube-system
              externalSecretSpec:
                secretStoreRef:
                  name: vault
                  kind: ClusterSecretStore
                target:
                  name: tsig-secret
                data:
                  - secretKey: secret
                    remoteRef:
                      key: maas/tsig
                      property: externaldns
            - kind: ExternalSecret
              name: maas-variables
              namespace: kcm-system
              externalSecretSpec:
                secretStoreRef:
                  name: vault
                  kind: ClusterSecretStore
                target:
                  name: maas-variables
                  creationPolicy: Merge   # patch into an existing Secret, don't own it
                  deletionPolicy: Merge   # on ES deletion, remove only ESO-managed keys
                data:
                  - secretKey: MAAS_API_KEY
                    remoteRef:
                      key: maas/api
                      property: key
