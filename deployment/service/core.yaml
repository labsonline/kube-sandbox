---
apiVersion: k0rdent.mirantis.com/v1beta1
kind: MultiClusterService
metadata:
  name: core
spec:
  clusterSelector:
    matchLabels:
      app.kubernetes.io/managed-by: Helm
  serviceSpec:
    priority: 100
    services:
      - template: gwapi-1-0-4
        name: envoy
        namespace: kube-system
        values: |
          envoy:
            proxies:
              - name: envoy-proxy
                mergeGateways: false
                logging:
                  level:
                    default: info
            classes:
              - name: envoy
                parametersRef:
                  group: gateway.envoyproxy.io
                  kind: EnvoyProxy
                  name: envoy-proxy
                  namespace: kube-system
            config:
              envoyGateway:
                gateway:
                  controllerName: gateway.envoyproxy.io/gatewayclass-controller
                provider:
                  type: Kubernetes
                logging:
                  level:
                    default: info
                extensionApis: {}
      - template: ca-1-0-4
        name: cert-manager
        namespace: cert-manager
        # dependsOn:
        #   - name: envoy
        #     namespace: kube-system
        values: |
          issuers:
            - name: ca-issuer-self-signed
              clustered: true
              selfSigned: true
              secret:
                create: false
          certmanager:
            enabled: true
            config:
              enableGatewayAPI: true
      - template: eso-2-5-0
        name: external-secret-operator
        namespace: operators
        dependsOn: []
        values: |
          eso:
            enabled: true
            replicaCount: 1
            bitwarden-sdk-server:
              enabled: false
              namespaceOverride: ""
